name: Driver taxi Flutter analysis
on:
  pull_request:
    paths:
      - 'lib/**'
      - '.github/workflows/hybrid-dispatch-flutter.yml'
jobs:
  flutter-analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check changed driver files
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/presentation/screens/rides/home_screen/home_screen.dart \
            lib/presentation/screens/rides/home_screen/widget/driver_standby_map.dart \
            lib/presentation/screens/rides/home_screen/widget/offer_bid_bottom_sheet.dart \
            lib/data/controller/dashboard/dashboard_controller.dart \
            lib/data/controller/dashboard/ride_queue_manager.dart \
            lib/data/services/push_notification_service.dart \
            lib/data/services/forground_location_service.dart \
            lib/data/model/global/ride/ride_model.dart
