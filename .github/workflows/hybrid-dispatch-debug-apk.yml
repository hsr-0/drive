name: Beytei hybrid taxi Android debug APK
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - '.github/workflows/hybrid-dispatch-debug-apk.yml'
jobs:
  android-test-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore missing Gradle wrapper executable and jar for CI
        run: |
          cd android
          gradle wrapper --gradle-version 8.13 --distribution-type bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: 'beytei-driver-hybrid-debug-apk'
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
