
# ==========================================
# BEYTEI DRIVER - GRADLE CONFIGURATION
# ==========================================

# Gradle JVM Memory
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Flutter Kotlin Compatibility
# Keep these settings for the current Flutter project
android.builtInKotlin=false
android.newDsl=false

# ==========================================
# 16KB PAGE SIZE - MOBILE SCANNER FIX
# ==========================================

# Use Google Play Services barcode scanner
# instead of the bundled native ML Kit model
dev.steenbakker.mobile_scanner.useUnbundled=true
